name: Sync Large Sources

# These sources have files too large (8-65MB) for Supabase Edge Function's 150s timeout.
# Run via GitHub Actions with no time limit instead.
#
# DISABLED 2026-03-27 (domains consolidated into HaGeZi TIF):
#   - PhishDestroy (crypto phishing domains → covered by HaGeZi)
#   - Jarelllama Scam (scam domains → covered by HaGeZi)
#   - Phishing.Database domains (→ covered by HaGeZi, IPs still via Edge Function)
# See: docs/superpowers/plans/2026-03-27-threat-intel-optimization.md
on:
  schedule:
    # Every 6 hours at :30 — offset from Edge Function cron (00:00)
    - cron: '30 1 */2 * *'
  workflow_dispatch: {}

jobs:
  sync-metamask:
    name: MetaMask eth-phishing-detect (~8MB, 200k+ domains)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Import MetaMask blacklist
        run: deno run --allow-net --allow-env scripts/import-metamask.ts
        timeout-minutes: 30

  sync-scamsniffer:
    name: ScamSniffer domains (~8.7MB, 300k+ domains)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Import ScamSniffer blacklist
        run: deno run --allow-net --allow-env scripts/import-scamsniffer.ts
        timeout-minutes: 45

  sync-phishing-db-links:
    name: Phishing.Database links (~65MB URLs) + HaGeZi TIF (~2.1M domains)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Import Phishing.Database links (largest, ~65MB)
        run: deno run --allow-net --allow-env scripts/import-phishing-links.ts
        timeout-minutes: 60
      - name: Test HaGeZi TIF importer
        run: deno test scripts/import-hagezi-tif_test.ts
      - name: Import HaGeZi TIF domains (~2.1M)
        id: sync_hagezi
        continue-on-error: true
        run: deno run --allow-net --allow-env scripts/import-hagezi-tif.ts
        timeout-minutes: 90
      - name: Warn when HaGeZi TIF sync fails
        if: steps.sync_hagezi.outcome == 'failure'
        run: echo "::warning::HaGeZi TIF sync failed; other large-source imports completed successfully."

